paperless-ngx:
  controllers:
    paperless:
      containers:
        main:
          image:
            repository: ghcr.io/paperless-ngx/paperless-ngx
            tag: 3.3.3@sha256:dba0242c1df1843643df4eb50ce5639f3a7900f414879088fd5bed8eaf2d456d
          env:
            PAPERLESS_REDIS: redis://paperless-ngx-redis-headless:6379
            PAPERLESS_TIKA_ENABLED: 1
            PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-ngx-gotenberg:3000
            PAPERLESS_TIKA_ENDPOINT: http://paperless-ngx-tika:9998
            PAPERLESS_URL: https://paper.ivanchenko.io
            PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
            PAPERLESS_DISABLE_REGULAR_LOGIN: True
            PAPERLESS_REDIRECT_LOGIN_TO_SSO: True
            PAPERLESS_SOCIAL_AUTO_SIGNUP: True
            OIDC_CLIENT_ID:
              valueFrom:
                secretKeyRef:
                  name: paperless-oidc
                  key: client_id
            OIDC_CLIENT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: paperless-oidc
                  key: client_secret
            PAPERLESS_SOCIALACCOUNT_PROVIDERS: >-
              {"openid_connect": {"APPS": [{"provider_id": "pocket-id", "name": "Pocket ID",
              "client_id": "$(OIDC_CLIENT_ID)", "secret": "$(OIDC_CLIENT_SECRET)",
              "settings": {"server_url": "https://id.ivanchenko.io/.well-known/openid-configuration"}}]}}
          envFrom:
            - secretRef:
                name: paperless-secret
    gotenberg:
      containers:
        main:
          image:
            repository: docker.io/gotenberg/gotenberg
            tag: 8.38@sha256:aa552cc115db488e0f0bcb07446aac13071ad51505b642c84bb894500907b42b
          command:
            - "gotenberg"
            - "--chromium-disable-javascript=true"
            - "--chromium-allow-list=file:///tmp/.*"
    tika:
      containers:
        main:
          image:
            repository: docker.io/apache/tika
            tag: 3.3.3.0@sha256:326b238b37904c94ff61fed87afe0af72e6a29fa715933b10af97b7d56f1d4cb
  service:
    paperless:
      controller: paperless
      type: ClusterIP
      ports:
        http:
          port: 8000
    gotenberg:
      controller: gotenberg
      type: ClusterIP
      ports:
        http:
          port: 3000
    tika:
      controller: tika
      type: ClusterIP
      ports:
        http:
          port: 9998
  route:
    paperless:
      hostnames:
        - paper.ivanchenko.io
      parentRefs:
        - name: internal-gw
          namespace: envoy-gateway
          sectionName: https
      rules:
        - backendRefs:
            - identifier: paperless
  persistence:
    data:
      enabled: true
      suffix: data
      storageClass: longhorn-ssd
      size: 1Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        paperless:
          main:
            - path: /usr/src/paperless/data
              subPath: data
            - path: /usr/src/paperless/media
              subPath: media
            - path: /usr/src/paperless/export
              subPath: export
            - path: /usr/src/paperless/consume
              subPath: consume

redis:
  enabled: true
  auth:
    enabled: false
    username: ""
  master:
    persistence:
      enabled: true
    resources:
      limits:
        cpu: null
  replica:
    replicaCount: 0
    resources:
      limits:
        cpu: null

helpers:
  oidcClients:
    - name: paperless
      spec:
        clientID: "cf6cf46b-b022-481c-87b2-61e7ed6d6655"
        callbackUrls:
          - "https://paper.ivanchenko.io/accounts/oidc/pocket-id/login/callback/"
        allowedUserGroups:
          - name: admins
            namespace: pocket-id
          - name: family
            namespace: pocket-id
        logo:
          autoGenerate: false
        secret:
          name: paperless-oidc
  infisicalSecrets:
    - name: paperless-secret
      infisical:
        path: "/paperless-ngx"
  backups:
    - pvcName: paperless-ngx-data
      resticRepoSuffix: paperless-ngx/data
      moverSecurityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
