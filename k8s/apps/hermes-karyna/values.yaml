hermes-karyna:
  controllers:
    hermes:
      pod:
        imagePullSecrets:
          - name: ghcr-login-secret
      containers:
        main:
          image: &hermesImage
            repository: ghcr.io/vanchaxy/hermes-karyna
            tag: sha-5d2447d
          env:
            TZ: Europe/Prague
            HINDSIGHT_MODE: local_external
            HINDSIGHT_API_URL: http://hermes-karyna-hindsight:8888
            SEARXNG_URL: http://hermes-karyna-searxng:8080
            HERMES_TELEGRAM_MEDIA_BATCH_DELAY_SECONDS: "2"
            HERMES_DASHBOARD: "1"
            HERMES_DASHBOARD_HOST: 0.0.0.0
            HERMES_DASHBOARD_PORT: "9119"
          envFrom:
            - secretRef:
                name: hermes-karyna-secret
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi

        browser:
          image: *hermesImage
          command:
            - /opt/hermes/.venv/bin/python
            - /opt/hermes/browser/browse.py
          env:
            TZ: Europe/Prague
            WARDROBE_HOME: /opt/data/wardrobe
            HOME: /tmp
            PYTHONDONTWRITEBYTECODE: "1"
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 8080
                periodSeconds: 30
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 8080
                periodSeconds: 15

    hindsight:
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: "OnRootMismatch"
          runAsUser: 1000
          runAsGroup: 1000
      containers:
        main:
          image:
            repository: ghcr.io/vectorize-io/hindsight
            tag: 0.9.2@sha256:84ab276b8f501546deb6ea9c64a57291718b4e16a59dd9e02a02fdd5adfe9028
          env:
            HINDSIGHT_API_WORKER_ID: hermes-karyna-hindsight
            HINDSIGHT_API_LLM_PROVIDER: claude-code
            HINDSIGHT_API_LLM_MODEL: claude-sonnet-5
            HINDSIGHT_API_RETAIN_LLM_MAX_CONCURRENT: "3"
            HINDSIGHT_API_RETAIN_LLM_INITIAL_BACKOFF: "2.0"
            HINDSIGHT_API_RETAIN_LLM_MAX_BACKOFF: "120.0"
            HINDSIGHT_API_CONSOLIDATION_LLM_PARALLELISM: "2"
            HINDSIGHT_API_LLM_OUTPUT_LANGUAGE: English
            HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: BAAI/bge-m3
            HINDSIGHT_API_RERANKER_PROVIDER: rrf
            HINDSIGHT_API_RERANKER_LOCAL_MODEL: BAAI/bge-reranker-v2-m3
            HINDSIGHT_API_TEXT_SEARCH_EXTENSION: native
            HINDSIGHT_API_TEXT_SEARCH_EXTENSION_NATIVE_LANGUAGE: english
          envFrom:
            - secretRef:
                name: hermes-karyna-secret
          resources:
            requests:
              cpu: 250m
              memory: 4Gi
            limits:
              memory: 6Gi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8888
                initialDelaySeconds: 120
                periodSeconds: 30
                failureThreshold: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8888
                initialDelaySeconds: 60
                periodSeconds: 15
                failureThreshold: 40

    cliproxy:
      containers:
        main:
          image:
            repository: docker.io/eceasy/cli-proxy-api
            tag: v7.2.151@sha256:9d3a608c20d386f5475a7c2ca01936e6441293168b639948f8ddbf8555ecc2b5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi

    searxng:
      containers:
        main:
          image:
            repository: docker.io/searxng/searxng
            tag: 2026.8.4-c63835bd2@sha256:f4c8e59de166ed71f6380c0847c312ca51f0d41996e31d0559163b6b09ecde52
          env:
            SEARXNG_BASE_URL: http://hermes-karyna-searxng:8080/
          envFrom:
            - secretRef:
                name: hermes-karyna-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

  service:
    hindsight:
      controller: hindsight
      suffix: hindsight
      type: ClusterIP
      ports:
        http:
          port: 8888
    dashboard:
      controller: hermes
      suffix: dashboard
      type: ClusterIP
      ports:
        http:
          port: 9119
    searxng:
      controller: searxng
      suffix: searxng
      type: ClusterIP
      ports:
        http:
          port: 8080
    cliproxy:
      controller: cliproxy
      suffix: cliproxy
      type: ClusterIP
      ports:
        http:
          port: 8317
    hindsight-ui:
      controller: hindsight
      suffix: hindsight-ui
      type: ClusterIP
      ports:
        http:
          port: 9999
    wardrobe:
      controller: hermes
      suffix: wardrobe
      type: ClusterIP
      ports:
        http:
          port: 8080

  route:
    dashboard:
      suffix: dashboard
      hostnames:
        - hermes.ivanchenko.io
      parentRefs:
        - name: internal-gw
          namespace: envoy-gateway
          sectionName: https
      rules:
        - backendRefs:
            - identifier: dashboard
    hindsight:
      suffix: hindsight
      hostnames:
        - hindsight.ivanchenko.io
      parentRefs:
        - name: internal-gw
          namespace: envoy-gateway
          sectionName: https
      rules:
        - backendRefs:
            - identifier: hindsight-ui
    wardrobe:
      suffix: wardrobe
      hostnames:
        - wardrobe.ivanchenko.io
      parentRefs:
        - name: internal-gw
          namespace: envoy-gateway
          sectionName: https
      rules:
        - backendRefs:
            - identifier: wardrobe

  persistence:
    data:
      enabled: true
      storageClass: longhorn-ssd
      size: 10Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        hermes:
          main:
            - path: /opt/data
          browser:
            - path: /opt/data
              readOnly: true
    hindsight-data:
      enabled: true
      storageClass: longhorn-ssd
      size: 10Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        hindsight:
          main:
            - path: /home/hindsight/.pg0
    hindsight-cache:
      enabled: true
      storageClass: longhorn-ssd
      size: 10Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        hindsight:
          main:
            - path: /home/hindsight/.cache
    hindsight-config:
      enabled: true
      type: configMap
      name: hermes-karyna-hindsight
      advancedMounts:
        hermes:
          main:
            - path: /config/hindsight
              readOnly: true
    cliproxy-auth:
      enabled: true
      storageClass: longhorn-ssd
      size: 1Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        cliproxy:
          main:
            - path: /root/.cli-proxy-api
    cliproxy-config:
      enabled: true
      type: configMap
      name: hermes-karyna-cliproxy
      advancedMounts:
        cliproxy:
          main:
            - path: /CLIProxyAPI/config.yaml
              subPath: config.yaml
              readOnly: true
    searxng-config:
      enabled: true
      type: configMap
      name: hermes-karyna-searxng
      advancedMounts:
        searxng:
          main:
            - path: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
    searxng-cache:
      enabled: true
      type: emptyDir
      advancedMounts:
        searxng:
          main:
            - path: /var/cache/searxng
  configMaps:
    cliproxy:
      enabled: true
      suffix: cliproxy
      data:
        config.yaml: |
          port: 8317
          host: ""
          auth-dir: "/root/.cli-proxy-api"
          api-keys: []
          remote-management:
            allow-remote: false
            secret-key: ""
          disable-claude-cloak-mode: false
    hindsight:
      enabled: true
      suffix: hindsight
      data:
        config.json: |
          {
            "memory_mode": "hybrid",
            "auto_recall": false,
            "recall_types": "observation,world,experience"
          }
    searxng:
      enabled: true
      suffix: searxng
      data:
        settings.yml: |
          use_default_settings: true
          server:
            limiter: false
            image_proxy: false
          search:
            formats:
              - html
              - json

helpers:
  ghcrSecret:
    enabled: true

  infisicalSecrets:
    - name: hermes-karyna-secret
      infisical:
        path: "/hermes-karyna"

  backups:
    - pvcName: hermes-karyna-data
      resticRepoSuffix: hermes-karyna/data
      moverSecurityContext:
        fsGroup: 10000
        runAsGroup: 10000
        runAsNonRoot: true
        runAsUser: 10000
    - pvcName: hermes-karyna-hindsight-data
      resticRepoSuffix: hermes-karyna/hindsight
      moverSecurityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    - pvcName: hermes-karyna-cliproxy-auth
      resticRepoSuffix: hermes-karyna/cliproxy-auth
      cacheCapacity: 1Gi
