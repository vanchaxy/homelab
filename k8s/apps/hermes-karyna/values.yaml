hermes-karyna:
  controllers:
    hermes:
      pod:
        imagePullSecrets:
          - name: ghcr-login-secret
      containers:
        main:
          image:
            repository: ghcr.io/vanchaxy/hermes-karyna
            tag: sha-879b9e4
          env:
            TZ: Europe/Prague
            HINDSIGHT_MODE: local_external
            HINDSIGHT_API_URL: http://hermes-karyna-hindsight:8888
            SEARXNG_URL: http://hermes-karyna-searxng:8080
            HERMES_DASHBOARD: "1"
            HERMES_DASHBOARD_HOST: 0.0.0.0
            HERMES_DASHBOARD_PORT: "9119"
          envFrom:
            - secretRef:
                name: hermes-karyna-secret
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi

    hindsight:
      pod:
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: "OnRootMismatch"
          runAsUser: 1000
          runAsGroup: 1000
      containers:
        main:
          image:
            repository: ghcr.io/vectorize-io/hindsight
            tag: 0.8.6@sha256:ffa391a77284e49f6b55e32c86f33529ac4257831407b14038a72b6a0a232039
          env:
            HINDSIGHT_API_WORKER_ID: hermes-karyna-hindsight
            HINDSIGHT_API_LLM_PROVIDER: gemini
            HINDSIGHT_API_LLM_MODEL: gemini-3.5-flash-lite
            HINDSIGHT_API_RETAIN_LLM_MODEL: gemini-3.6-flash
            HINDSIGHT_API_LLM_OUTPUT_LANGUAGE: English
            HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL: BAAI/bge-m3
            HINDSIGHT_API_RERANKER_LOCAL_MODEL: BAAI/bge-reranker-v2-m3
            HINDSIGHT_API_TEXT_SEARCH_EXTENSION: native
            HINDSIGHT_API_TEXT_SEARCH_EXTENSION_NATIVE_LANGUAGE: english
          envFrom:
            - secretRef:
                name: hermes-karyna-secret
          resources:
            requests:
              cpu: 250m
              memory: 4Gi
            limits:
              memory: 6Gi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8888
                initialDelaySeconds: 120
                periodSeconds: 30
                failureThreshold: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /health
                  port: 8888
                initialDelaySeconds: 60
                periodSeconds: 15
                failureThreshold: 40

    searxng:
      containers:
        main:
          image:
            repository: docker.io/searxng/searxng
            tag: 2026.8.4-c63835bd2@sha256:f4c8e59de166ed71f6380c0847c312ca51f0d41996e31d0559163b6b09ecde52
          env:
            SEARXNG_BASE_URL: http://hermes-karyna-searxng:8080/
          envFrom:
            - secretRef:
                name: hermes-karyna-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

  service:
    hindsight:
      controller: hindsight
      suffix: hindsight
      type: ClusterIP
      ports:
        http:
          port: 8888
    dashboard:
      controller: hermes
      suffix: dashboard
      type: ClusterIP
      ports:
        http:
          port: 9119
    searxng:
      controller: searxng
      suffix: searxng
      type: ClusterIP
      ports:
        http:
          port: 8080
    hindsight-ui:
      controller: hindsight
      suffix: hindsight-ui
      type: ClusterIP
      ports:
        http:
          port: 9999

  route:
    dashboard:
      suffix: dashboard
      hostnames:
        - hermes.ivanchenko.io
      parentRefs:
        - name: internal-gw
          namespace: envoy-gateway
          sectionName: https
      rules:
        - backendRefs:
            - identifier: dashboard
    hindsight:
      suffix: hindsight
      hostnames:
        - hindsight.ivanchenko.io
      parentRefs:
        - name: internal-gw
          namespace: envoy-gateway
          sectionName: https
      rules:
        - backendRefs:
            - identifier: hindsight-ui

  persistence:
    data:
      enabled: true
      storageClass: longhorn-ssd
      size: 10Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        hermes:
          main:
            - path: /opt/data
    hindsight-data:
      enabled: true
      storageClass: longhorn-ssd
      size: 10Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        hindsight:
          main:
            - path: /home/hindsight/.pg0
    hindsight-cache:
      enabled: true
      storageClass: longhorn-ssd
      size: 10Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        hindsight:
          main:
            - path: /home/hindsight/.cache
    searxng-config:
      enabled: true
      type: configMap
      name: hermes-karyna-searxng
      advancedMounts:
        searxng:
          main:
            - path: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
    searxng-cache:
      enabled: true
      type: emptyDir
      advancedMounts:
        searxng:
          main:
            - path: /var/cache/searxng
  configMaps:
    searxng:
      enabled: true
      suffix: searxng
      data:
        settings.yml: |
          use_default_settings: true
          server:
            limiter: false
            image_proxy: false
          search:
            formats:
              - html
              - json

helpers:
  ghcrSecret:
    enabled: true

  # GEMINI_API_KEY, HINDSIGHT_API_LLM_API_KEY, TELEGRAM_BOT_TOKEN,
  # TELEGRAM_ALLOWED_USERS, HINDSIGHT_DB_PASSWORD,
  # HERMES_DASHBOARD_BASIC_AUTH_USERNAME, HERMES_DASHBOARD_BASIC_AUTH_PASSWORD,
  # SEARXNG_SECRET
  infisicalSecrets:
    - name: hermes-karyna-secret
      infisical:
        path: "/hermes-karyna"

  backups:
    - pvcName: hermes-karyna-data
      resticRepoSuffix: hermes-karyna/data
    - pvcName: hermes-karyna-hindsight-data
      resticRepoSuffix: hermes-karyna/hindsight
      moverSecurityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
