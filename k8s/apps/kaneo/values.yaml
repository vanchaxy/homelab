kaneo:
  controllers:
    api:
      containers:
        main:
          image:
            repository: ghcr.io/usekaneo/api
            tag: 2.46.2@sha256:8a758cbd8e229b877ee9f8b87200d39241d850f39507e000a21d983ebbbaa7a6
          resources:
            requests:
              cpu: 10m
              memory: 512Mi
            limits:
              memory: 512Mi
          envFrom:
            - secretRef:
                name: kaneo-s3
          env:
            KANEO_CLIENT_URL: "https://kaneo.ivanchenko.io"
            KANEO_API_URL: "https://kaneo.ivanchenko.io"
            DISABLE_GUEST_ACCESS: 'true'
            DISABLE_REGISTRATION: 'true'
            DATABASE_URL:
              valueFrom:
                secretKeyRef:
                  name: kaneo-secret
                  key: dburi
            AUTH_SECRET:
              valueFrom:
                secretKeyRef:
                  name: kaneo-secret
                  key: AUTH_SECRET
            CUSTOM_OAUTH_CLIENT_ID: kaneo
            CUSTOM_OAUTH_CLIENT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: kaneo-oidc
                  key: client_secret
            CUSTOM_OAUTH_DISCOVERY_URL: https://id.ivanchenko.io/.well-known/openid-configuration
            CUSTOM_OAUTH_SCOPES: "openid,profile,email"
            S3_ENDPOINT: https://s3.ivanchenko.io
            S3_BUCKET: kaneo
            

    web:
      containers:
        main:
          image:
            repository: ghcr.io/usekaneo/web
            tag: 2.46.2@sha256:42f299412d44a27da5d98afc123f79a3c53ec3e5631880edf864c33d15bd5a7e
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 64Mi
          env:
            KANEO_API_URL: "https://kaneo.ivanchenko.io"
            KANEO_CLIENT_URL: "https://kaneo.ivanchenko.io"

  service:
    api:
      controller: api
      ports:
        http:
          port: 1337

    web:
      controller: web
      ports:
        http:
          port: 5173

  route:
    main:
      hostnames:
        - kaneo.ivanchenko.io
      parentRefs:
        - name: internal-gw
          namespace: envoy-gateway
          sectionName: https
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: kaneo-web
              port: 5173
        - matches:
            - path:
                type: PathPrefix
                value: /api/
          backendRefs:
            - name: kaneo-api
              port: 1337

helpers:
  oidcClients:
    - name: kaneo
      spec:
        clientID: "kaneo"
        callbackUrls:
          - "https://kaneo.ivanchenko.io/api/auth/oauth2/callback/custom"
        launchUrl: "https://kaneo.ivanchenko.io/"
        allowedUserGroups:
          - name: family
            namespace: pocket-id
        secret:
          name: kaneo-oidc
  infisicalSecrets:
    - name: kaneo-secret
      type: kubernetes.io/basic-auth
      infisical:
        path: "/kaneo"
    - name: kaneo-s3
      namespace: kaneo
      infisical:
        path: "/versitygw"
      template:
        data:
          S3_ACCESS_KEY_ID: "{{ .rootAccessKeyId.Value }}"
          S3_SECRET_ACCESS_KEY: "{{ .rootSecretAccessKey.Value }}"
  backups:
    - pvcName: kaneo-postgres-1
      resticRepoSuffix: kaneo/postgres
      unlock: "2026-09-11"
      moverSecurityContext:
        fsGroup: 26
        runAsGroup: 26
        runAsNonRoot: true
        runAsUser: 26
