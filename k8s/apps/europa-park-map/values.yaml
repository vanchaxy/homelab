europa-park-map:
  controllers:
    main:
      pod:
        imagePullSecrets:
          - name: ghcr-login-secret
      containers:
        main:
          image:
            repository: ghcr.io/vanchaxy/europa-park-map
            tag: 0.5.0@sha256:a155eb3f87043fe26d1b72c652a1f78d1c0568b2cecd0ca523aa1f610b6164f4
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true

  service:
    main:
      controller: main
      type: ClusterIP
      ports:
        http:
          port: 8080

  persistence:
    # nginx tile cache (proxied official map artwork)
    tile-cache:
      type: emptyDir
      sizeLimit: 2Gi
      globalMounts:
        - path: /tmp/tile-cache

  route:
    main:
      hostnames:
        - park.ivanchenko.io
      parentRefs:
        - name: internal-gw
          namespace: envoy-gateway
          sectionName: https
      rules:
        - backendRefs:
            - identifier: main

helpers:
  ghcrSecret:
    enabled: true
