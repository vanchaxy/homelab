yamtrack:
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/fuzzygrim/yamtrack
            tag: 0.26.3@sha256:78497b454b2b52d3b1062f6fd238351d714cff0895db4369e49ace36f4622e75
          env:
            REDIS_URL: redis://yamtrack-redis-headless:6379
            SOCIAL_PROVIDERS: allauth.socialaccount.providers.openid_connect
            SOCIALACCOUNT_ONLY: True
            REDIRECT_LOGIN_TO_SSO: True
            OIDC_CLIENT_ID:
              valueFrom:
                secretKeyRef:
                  name: yamtrack-oidc
                  key: client_id
            OIDC_CLIENT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: yamtrack-oidc
                  key: client_secret
            SOCIALACCOUNT_PROVIDERS: >-
              {"openid_connect": {"OAUTH_PKCE_ENABLED": true, "APPS": [{"provider_id": "pocketid", "name": "Pocket ID",
              "client_id": "$(OIDC_CLIENT_ID)", "secret": "$(OIDC_CLIENT_SECRET)",
              "settings": {"server_url": "https://id.ivanchenko.io/.well-known/openid-configuration"}}]}}
          envFrom:
            - secretRef:
                name: yamtrack-secret
  service:
    main:
      controller: main
      type: ClusterIP
      ports:
        http:
          port: 8000

  route:
    main:
      hostnames:
        - yamtrack.ivanchenko.io
      parentRefs:
        - name: internal-gw
          namespace: envoy-gateway
          sectionName: https

  persistence:
    data:
      enabled: true
      suffix: data
      storageClass: longhorn-ssd
      size: 5Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        main:
          main:
            - path: /yamtrack/db

redis:
  enabled: true
  auth:
    enabled: false
    username: ""
  master:
    persistence:
      enabled: false
    resources:
      limits:
        cpu: null
  replica:
    replicaCount: 0
    resources:
      limits:
        cpu: null

helpers:
  oidcClients:
    - name: yamtrack
      spec:
        clientID: "92e48243-a792-4c9d-afb1-982143bf2b0e"
        callbackUrls:
          - "https://yamtrack.ivanchenko.io/accounts/oidc/pocketid/login/callback/"
        launchUrl: "https://yamtrack.ivanchenko.io/"
        pkceEnabled: true
        allowedUserGroups:
          - name: family
            namespace: pocket-id
        secret:
          name: yamtrack-oidc
  infisicalSecrets:
    - name: yamtrack-secret
      namespace: yamtrack
      infisical:
        path: "/yamtrack"
  backups:
    - pvcName: yamtrack-data
      resticRepoSuffix: yamtrack
