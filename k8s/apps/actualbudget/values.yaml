actualbudget:
  defaultPodOptions:
    automountServiceAccountToken: false
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - jupiter

  controllers:
    actualbudget:
      containers:
        main:
          image:
            repository: actualbudget/actual-server
            tag: 26.10.0@sha256:24645e971da6bb1a1f953d6859e307a0b29be1e8b4130a35b3220c209b5b860c
          env:
            ACTUAL_OPENID_SERVER_HOSTNAME: https://budget.ivanchenko.io
            # ACTUAL_OPENID_ENFORCE: true
            ACTUAL_LOGIN_METHOD: password
            ACTUAL_OPENID_AUTH_METHOD: openid
            ACTUAL_OPENID_DISCOVERY_URL:
              valueFrom:
                secretKeyRef:
                  name: actualbudget-oidc
                  key: discovery_url
            ACTUAL_OPENID_CLIENT_ID:
              valueFrom:
                secretKeyRef:
                  name: actualbudget-oidc
                  key: client_id
            ACTUAL_OPENID_CLIENT_SECRET:
              valueFrom:
                secretKeyRef:
                  name: actualbudget-oidc
                  key: client_secret
          envFrom:
            - secretRef:
                name: actualbudget-secret

    bank-sync-web:
      pod:
        imagePullSecrets:
          - name: ghcr-login-secret
      containers:
        main:
          image:
            repository: ghcr.io/vanchaxy/bank-sync
            tag: sha-c55fc32

  service:
    actualbudget:
      controller: actualbudget
      type: ClusterIP
      ports:
        http:
          port: 5006
    bank-sync-web:
      controller: bank-sync-web
      type: ClusterIP
      ports:
        http:
          port: 8000

  route:
    actualbudget:
      hostnames:
        - budget.ivanchenko.io
      parentRefs:
        - name: internal-gw
          namespace: envoy-gateway
          sectionName: https
      rules:
        - backendRefs:
            - identifier: actualbudget
    bank-sync-web:
      hostnames:
        - bank-sync.ivanchenko.io
      parentRefs:
        - name: internal-gw
          namespace: envoy-gateway
          sectionName: https
      rules:
        - backendRefs:
            - identifier: bank-sync-web

  persistence:
    data:
      enabled: true
      storageClass: longhorn-ssd
      size: 1Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        actualbudget:
          main:
            - path: /data
    bank-sync:
      enabled: true
      storageClass: longhorn-ssd
      size: 1Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        bank-sync-web:
          main:
            - path: /data

helpers:
  oidcClients:
    - name: actualbudget
      spec:
        clientID: "17dc6d8b-ca46-43ad-b2e2-618f07e0e77a"
        callbackUrls:
          - "https://budget.ivanchenko.io/openid/callback"
        logo:
          autoGenerate: false
        secret:
          name: actualbudget-oidc
  ghcrSecret:
    enabled: true
  infisicalSecrets:
    - name: actualbudget-secret
      infisical:
        path: "/actualbudget"
  backups:
    - pvcName: actualbudget-data
      resticRepoSuffix: actualbudget/data
    - pvcName: actualbudget-bank-sync
      resticRepoSuffix: actualbudget/bank-sync
