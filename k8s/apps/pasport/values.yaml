pasport:
  defaultPodOptions:
    automountServiceAccountToken: false
    securityContext:
      # The image runs as pwuser (1001). Without fsGroup the mounted volume
      # comes up root-owned, the container cannot write to /data, and the app
      # quietly falls back to a directory inside the image.
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001

  controllers:
    main:
      pod:
        imagePullSecrets:
          - name: ghcr-login-secret
      containers:
        main:
          image:
            repository: ghcr.io/vanchaxy/pasport
            tag: sha-5586899
          envFrom:
            - secretRef:
                name: pasport-secret
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              # Chromium is the whole workload here. It idles between checks and
              # spikes briefly while a page renders.
              memory: 2Gi

  persistence:
    # Everything in /data — the Playwright profile and the notification
    # de-duplication state — rebuilds itself on a fresh start, so there is
    # nothing here worth a PersistentVolume or a backup. Worst case after a
    # restart is one repeated "booking is open" message.
    data:
      type: emptyDir
      advancedMounts:
        main:
          main:
            - path: /data

    # Chromium crashes on the 64Mi default /dev/shm. The container already runs
    # with --disable-dev-shm-usage, so this is belt and braces, and cheap.
    dshm:
      type: emptyDir
      medium: Memory
      sizeLimit: 1Gi
      advancedMounts:
        main:
          main:
            - path: /dev/shm

helpers:
  # Image lives in a private GHCR package.
  ghcrSecret:
    enabled: true

  # Needs TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.
  infisicalSecrets:
    - name: pasport-secret
      infisical:
        path: "/pasport"
