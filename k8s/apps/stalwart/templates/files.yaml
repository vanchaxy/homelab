apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-files
data:
  config.json: |
    {"@type":"RocksDb","path":"/var/lib/stalwart/data"}
  plan.ndjson: |
{{ .Files.Get "files/plan.ndjson" | indent 4 }}
  inbound.sieve: |
{{ .Files.Get "files/inbound.sieve" | indent 4 }}
  install-sieve.py: |
{{ .Files.Get "files/install-sieve.py" | indent 4 }}
  fetch.py: |
{{ .Files.Get "files/fetch.py" | indent 4 }}
  sources: |
{{ .Files.Get "files/sources" | indent 4 }}
