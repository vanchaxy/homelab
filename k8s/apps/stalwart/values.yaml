configure:
  renderImage: docker.io/library/alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  cliImage: docker.io/stalwartlabs/cli:1.0.14@sha256:5b70732cb69cdab3ff0894c501544cf0bfa180fa75bcd0eeba4eebe04c1064e1

stalwart:
  defaultPodOptions:
    automountServiceAccountToken: false

  controllers:
    main:
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 2000
          fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        migrate:
          image:
            repository: ghcr.io/stalwartlabs/stalwart-migrate
            tag: 1.0.4@sha256:476d45fe860da8c37718d4f68ee33dd8ff6d4d167e84940593802bd3d8da08be
          command:
            - sh
            - /migrate/migrate-final.sh
          env:
            STALWART_MIGRATE_STATE: /var/lib/stalwart/migrate
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
      containers:
        main:
          image:
            repository: docker.io/stalwartlabs/stalwart
            tag: v1.0.1@sha256:b9da4df8b4efc06bc926dd6e990bdeb0ad7b9261a7c3893d74b0461a00bb389b
          args:
            - --config
            - /etc/stalwart/config.json
          envFrom:
            - secretRef:
                name: stalwart-secrets
          env:
            STALWART_PUBLIC_URL: https://stalwart.ivanchenko.io
          resources:
            requests:
              cpu: 20m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz/live
                  port: 8080
                initialDelaySeconds: 30
                periodSeconds: 10
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz/ready
                  port: 8080
                periodSeconds: 10
        fetch:
          image:
            repository: docker.io/library/python
            tag: 3.14-alpine@sha256:601e99e090cb08c2784a42395487709500bc39930307fe72f3f11a8f3c430762
          command:
            - python
            - -I
            - /config/fetch.py
          envFrom:
            - secretRef:
                name: stalwart-secrets
          resources:
            requests:
              cpu: 5m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000

    bulwark:
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1001
          fsGroupChangePolicy: "OnRootMismatch"
      containers:
        main:
          image:
            repository: ghcr.io/bulwarkmail/webmail
            tag: 1.19.1@sha256:dcb6ef96e3b020fa30d8a161b94ea39431f4a21a97a663cbc980b515e894879b
          env:
            APP_NAME: Mail
            JMAP_SERVER_URL: https://stalwart.ivanchenko.io
            STALWART_FEATURES: "true"
            OAUTH_ENABLED: "true"
            OAUTH_ONLY: "true"
            OAUTH_ISSUER_URL: https://id.ivanchenko.io
            OAUTH_CLIENT_ID: bulwark
            OAUTH_SCOPES: openid email profile groups offline_access
            OAUTH_END_SESSION: "false"
            SETTINGS_SYNC_ENABLED: "true"
            SESSION_SECRET:
              valueFrom:
                secretKeyRef:
                  name: stalwart-secrets
                  key: SESSION_SECRET
            BULWARK_TELEMETRY: "off"
          resources:
            requests:
              cpu: 10m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsUser: 1001
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000
                initialDelaySeconds: 30
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000

  service:
    http:
      controller: main
      ports:
        http:
          port: 8080
    mail:
      controller: main
      type: LoadBalancer
      loadBalancerIP: 10.10.61.232
      annotations:
        internal.ivanchenko.io/hostname: "imap.ivanchenko.io"
      ports:
        imaps:
          port: 993
        submissions:
          port: 465
        submission:
          port: 587
        sieve:
          port: 4190
    bulwark:
      controller: bulwark
      ports:
        http:
          port: 3000

  route:
    stalwart:
      hostnames:
        - stalwart.ivanchenko.io
      parentRefs:
        - name: internal-gw
          namespace: envoy-gateway
          sectionName: https
      rules:
        - backendRefs:
            - identifier: http
              port: 8080
    bulwark:
      hostnames:
        - mail.ivanchenko.io
      parentRefs:
        - name: internal-gw
          namespace: envoy-gateway
          sectionName: https
      rules:
        - backendRefs:
            - identifier: bulwark
              port: 3000

  persistence:
    data:
      enabled: true
      suffix: data
      storageClass: longhorn-ssd
      size: 10Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        main:
          migrate:
            - path: /var/lib/stalwart
          main:
            - path: /var/lib/stalwart
          fetch:
            - path: /var/lib/stalwart
    bulwark:
      enabled: true
      suffix: bulwark
      storageClass: longhorn-ssd
      size: 1Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        bulwark:
          main:
            - path: /app/data
    files:
      type: configMap
      name: stalwart-files
      advancedMounts:
        main:
          migrate:
            - path: /etc/stalwart/config.json
              subPath: config-v016.json
              readOnly: true
            - path: /etc/stalwart-v1/config.json
              subPath: config.json
              readOnly: true
            - path: /migrate/migrate-final.sh
              subPath: migrate-final.sh
              readOnly: true
          main:
            - path: /etc/stalwart/config.json
              subPath: config.json
              readOnly: true
          fetch:
            - path: /config
              readOnly: true
    tls:
      type: secret
      name: stalwart-tls
      advancedMounts:
        main:
          main:
            - path: /etc/stalwart/tls
              readOnly: true

helpers:
  oidcClients:
    - name: bulwark
      spec:
        clientID: "bulwark"
        callbackUrls:
          - "https://mail.ivanchenko.io/en/auth/callback"
          - "https://mail.ivanchenko.io/uk/auth/callback"
          - "https://stalwart.ivanchenko.io/admin/oauth/callback"
          - "https://stalwart.ivanchenko.io/account/oauth/callback"
        launchUrl: "https://mail.ivanchenko.io/"
        isPublic: true
        pkceEnabled: true
        allowedUserGroups:
          - name: admins
            namespace: pocket-id
          - name: family
            namespace: pocket-id
        secret:
          name: bulwark-oidc
  infisicalSecrets:
    - name: stalwart-secrets
      infisical:
        path: "/stalwart"
      template:
        includeAllSecrets: true
        data:
          STALWART_RECOVERY_ADMIN: "admin:{{ .ADMIN_PASSWORD.Value }}"
  backups:
    - enabled: true
      pvcName: stalwart-data
      resticRepoSuffix: stalwart/data
      moverSecurityContext:
        fsGroup: 2000
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
    - enabled: true
      pvcName: stalwart-bulwark
      resticRepoSuffix: stalwart/bulwark
      moverSecurityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
