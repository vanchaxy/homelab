configure:
  renderImage: docker.io/library/alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
  cliImage: docker.io/stalwartlabs/cli:2.0.0@sha256:8588aa3ea88ed740f83292ab37760869541df3da39cd1c8e6494fb43ece888c9

stalwart:
  defaultPodOptions:
    automountServiceAccountToken: false

  controllers:
    main:
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 2000
          fsGroupChangePolicy: "OnRootMismatch"
      containers:
        main:
          image:
            repository: docker.io/stalwartlabs/stalwart
            tag: v1.1.0@sha256:f772aa6ef8cd8018969fa491640f1436b0270eb14e2c219b5f37f1a77020837e
          args:
            - --config
            - /etc/stalwart/config.json
          envFrom:
            - secretRef:
                name: stalwart-secrets
          env:
            STALWART_PUBLIC_URL: https://stalwart.ivanchenko.io
          resources:
            requests:
              cpu: 20m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz/live
                  port: 8080
                initialDelaySeconds: 30
                periodSeconds: 10
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz/ready
                  port: 8080
                periodSeconds: 10
        fetch:
          image:
            repository: docker.io/library/python
            tag: 3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
          command:
            - python
            - -I
            - /config/fetch.py
          envFrom:
            - secretRef:
                name: stalwart-secrets
          resources:
            requests:
              cpu: 5m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000

    bulwark:
      strategy: Recreate
      pod:
        securityContext:
          fsGroup: 1001
          fsGroupChangePolicy: "OnRootMismatch"
      containers:
        main:
          image:
            repository: ghcr.io/bulwarkmail/webmail
            tag: 1.21.2@sha256:037b85b1433233d2d7eebb83f928df5ecc3b4adc91dc7e4c55f0a2f69024e754
          env:
            APP_NAME: Mail
            JMAP_SERVER_URL: https://stalwart.ivanchenko.io
            STALWART_FEATURES: "true"
            OAUTH_ENABLED: "true"
            OAUTH_ONLY: "true"
            OAUTH_ISSUER_URL: https://id.ivanchenko.io
            OAUTH_CLIENT_ID: bulwark
            OAUTH_SCOPES: openid email profile groups offline_access
            OAUTH_END_SESSION: "false"
            SETTINGS_SYNC_ENABLED: "true"
            SESSION_SECRET:
              valueFrom:
                secretKeyRef:
                  name: stalwart-secrets
                  key: SESSION_SECRET
            BULWARK_TELEMETRY: "off"
          resources:
            requests:
              cpu: 10m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsUser: 1001
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000
                initialDelaySeconds: 30
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: 3000

  service:
    http:
      controller: main
      ports:
        http:
          port: 8080
    mail:
      controller: main
      type: LoadBalancer
      loadBalancerIP: 10.10.61.232
      annotations:
        internal.ivanchenko.io/hostname: "imap.ivanchenko.io"
      ports:
        imaps:
          port: 993
        submissions:
          port: 465
        submission:
          port: 587
        sieve:
          port: 4190
    bulwark:
      controller: bulwark
      ports:
        http:
          port: 3000

  route:
    stalwart:
      hostnames:
        - stalwart.ivanchenko.io
      parentRefs:
        - name: internal-gw
          namespace: envoy-gateway
          sectionName: https
      rules:
        - backendRefs:
            - identifier: http
              port: 8080
    bulwark:
      hostnames:
        - mail.ivanchenko.io
      parentRefs:
        - name: internal-gw
          namespace: envoy-gateway
          sectionName: https
      rules:
        - backendRefs:
            - identifier: bulwark
              port: 3000

  persistence:
    data:
      enabled: true
      suffix: data
      storageClass: longhorn-ssd
      size: 10Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        main:
          main:
            - path: /var/lib/stalwart
          fetch:
            - path: /var/lib/stalwart
    bulwark:
      enabled: true
      suffix: bulwark
      storageClass: longhorn-ssd
      size: 1Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        bulwark:
          main:
            - path: /app/data
    files:
      type: configMap
      name: stalwart-files
      advancedMounts:
        main:
          main:
            - path: /etc/stalwart/config.json
              subPath: config.json
              readOnly: true
          fetch:
            - path: /config
              readOnly: true
    tls:
      type: secret
      name: stalwart-tls
      advancedMounts:
        main:
          main:
            - path: /etc/stalwart/tls
              readOnly: true

helpers:
  oidcClients:
    - name: bulwark
      spec:
        clientID: "bulwark"
        callbackUrls:
          - "https://mail.ivanchenko.io/en/auth/callback"
          - "https://mail.ivanchenko.io/uk/auth/callback"
          - "https://stalwart.ivanchenko.io/admin/oauth/callback"
          - "https://stalwart.ivanchenko.io/account/oauth/callback"
        launchUrl: "https://mail.ivanchenko.io/"
        isPublic: true
        pkceEnabled: true
        allowedUserGroups:
          - name: admins
            namespace: pocket-id
          - name: family
            namespace: pocket-id
        secret:
          name: bulwark-oidc
  infisicalSecrets:
    - name: stalwart-secrets
      infisical:
        path: "/stalwart"
      template:
        includeAllSecrets: true
        data:
          STALWART_RECOVERY_ADMIN: "admin:{{ .ADMIN_PASSWORD.Value }}"
  backups:
    - enabled: true
      pvcName: stalwart-data
      resticRepoSuffix: stalwart/data
      moverSecurityContext:
        fsGroup: 2000
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
    - enabled: true
      pvcName: stalwart-bulwark
      resticRepoSuffix: stalwart/bulwark
      moverSecurityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
