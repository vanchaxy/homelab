satisfactory:
  controllers:
    main:
      containers:
        main:
          image:
            repository: wolveix/satisfactory-server
            tag: v1.9.11@sha256:ac252dba41653eb21c6feed94b577f98fa152f5792b1aeff2ce11fe364355137
          resources:
            requests:
              memory: 16Gi
            limits:
              memory: 16Gi

  service:
    main:
      controller: main
      type: LoadBalancer
      annotations:
        external-dns.alpha.kubernetes.io/hostname: "sf.ivanchenko.io"
        lbipam.cilium.io/lb-ipam-ips: 46.38.230.69
        lbipam.cilium.io/sharing-key: vps-tunnel
        lbipam.cilium.io/sharing-cross-namespace: "*"
      ports:
        api:
          port: 7777
          protocol: TCP
        game:
          port: 7777
          protocol: UDP
        messaging:
          port: 8888
          protocol: TCP
    internal:
      controller: main
      type: LoadBalancer
      loadBalancerIP: 10.10.61.235
      annotations:
        internal.ivanchenko.io/hostname: "sf.ivanchenko.io"
      ports:
        api:
          port: 7777
          protocol: TCP
        game:
          port: 7777
          protocol: UDP
        messaging:
          port: 8888
          protocol: TCP

  persistence:
    config:
      enabled: true
      suffix: config
      storageClass: longhorn-ssd
      size: 1Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        main:
          main:
            - path: /config/backups
              subPath: backups
            - path: /config/logs
              subPath: logs
            - path: /config/saved
              subPath: saved
    gamefiles:
      enabled: true
      suffix: gamefiles
      storageClass: longhorn-ssd
      size: 20Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        main:
          main:
            - path: /config/gamefiles
helpers:
  backups:
    - enabled: false
      pvcName: satisfactory-config
      resticRepoSuffix: satisfactory
