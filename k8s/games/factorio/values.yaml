factorio:
  controllers:
    main:
      initContainers:
        settings:
          image:
            repository: factoriotools/factorio
            tag: 2.1.21@sha256:0be9e1d305725a2071476a4acdc80642bb9ae305c6e2805e9633697f2de84c60
          command:
            - sh
            - -c
            - |
              f=/factorio/config/server-settings.json
              [ -f "$f" ] || exit 0
              jq '.visibility.public = false | .visibility.lan = false' "$f" > "$f.tmp"
              mv "$f.tmp" "$f"
      containers:
        main:
          image:
            repository: factoriotools/factorio
            tag: 2.1.21@sha256:0be9e1d305725a2071476a4acdc80642bb9ae305c6e2805e9633697f2de84c60

  service:
    main:
      controller: main
      type: LoadBalancer
      annotations:
        external-dns.alpha.kubernetes.io/hostname: "factorio.ivanchenko.io"
        lbipam.cilium.io/lb-ipam-ips: 46.38.230.69
        lbipam.cilium.io/sharing-key: vps-tunnel
        lbipam.cilium.io/sharing-cross-namespace: "*"
      labels:
        expose-public: "true"
      ports:
        game:
          port: 34197
          protocol: UDP
        query:
          port: 27015
          protocol: TCP
    internal:
      controller: main
      type: LoadBalancer
      annotations:
        internal.ivanchenko.io/hostname: "factorio.ivanchenko.io"
      loadBalancerIP: 10.10.61.230
      ports:
        game:
          port: 34197
          protocol: UDP
        query:
          port: 27015
          protocol: TCP

  persistence:
    server:
      enabled: true
      storageClass: longhorn-ssd
      size: 1Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        main:
          main:
            - path: /factorio
          settings:
            - path: /factorio

helpers:
  backups:
    - pvcName: factorio
      resticRepoSuffix: factorio
      moverSecurityContext:
        fsGroup: 845
        runAsGroup: 845
        runAsUser: 845
