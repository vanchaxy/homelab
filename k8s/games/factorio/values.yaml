factorio:
  controllers:
    main:
      containers:
        main:
          image:
            repository: factoriotools/factorio
            tag: 2.1.23@sha256:e0d0b767d76b5c6fff352b998ad36e72c614af65afd5b21183b9b87bbae55948

  service:
    main:
      controller: main
      type: LoadBalancer
      annotations:
        external-dns.kubernetes.io/hostname: "factorio.ivanchenko.io"
        lbipam.cilium.io/lb-ipam-ips: 46.38.230.69
        lbipam.cilium.io/sharing-key: vps-tunnel
        lbipam.cilium.io/sharing-cross-namespace: "*"
      labels:
        expose-public: "true"
      ports:
        game:
          port: 34197
          protocol: UDP
    internal:
      controller: main
      type: LoadBalancer
      annotations:
        internal.ivanchenko.io/hostname: "factorio.ivanchenko.io"
      loadBalancerIP: 10.10.61.230
      ports:
        game:
          port: 34197
          protocol: UDP
        query:
          port: 27015
          protocol: TCP

  persistence:
    server:
      enabled: true
      storageClass: longhorn-ssd
      size: 1Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        main:
          main:
            - path: /factorio

helpers:
  backups:
    - pvcName: factorio
      resticRepoSuffix: factorio
      moverSecurityContext:
        fsGroup: 845
        runAsGroup: 845
        runAsUser: 845
