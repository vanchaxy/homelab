enshrouded:
  controllers:
    main:
      pod:
        terminationGracePeriodSeconds: 90
      containers:
        main:
          image:
            repository: mornedhels/enshrouded-server
            tag: 1.8.0-proton@sha256:689dcb30037b0c63e6929b2fe5951eaf8eca52a43792b2764440baeb012b2aa1
          env:
            SERVER_NAME: Enshrouded Server
            SERVER_SLOT_COUNT: 16
            SERVER_QUERYPORT: 15637
            SERVER_SAVE_DIR: /home/enshrouded/savegame
            UPDATE_CRON: "*/30 * * * *"
            UPDATE_CHECK_PLAYERS: "true"
            SERVER_ROLE_0_NAME: Admin
            SERVER_ROLE_0_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: enshrouded-secret
                  key: SERVER_ROLE_0_PASSWORD
            SERVER_ROLE_0_CAN_KICK_BAN: "true"
            SERVER_ROLE_0_CAN_ACCESS_INVENTORIES: "true"
            SERVER_ROLE_0_CAN_EDIT_WORLD: "true"
            SERVER_ROLE_0_CAN_EDIT_BASE: "true"
            SERVER_ROLE_0_CAN_EXTEND_BASE: "true"
            SERVER_ROLE_0_RESERVED_SLOTS: 0
          resources:
            requests:
              memory: 6Gi

  service:
    main:
      controller: main
      type: LoadBalancer
      annotations:
        external-dns.alpha.kubernetes.io/hostname: "enshrouded.ivanchenko.io"
        lbipam.cilium.io/lb-ipam-ips: 46.38.230.69
        lbipam.cilium.io/sharing-key: vps-tunnel
        lbipam.cilium.io/sharing-cross-namespace: "*"
      labels:
        expose-public: "true"
      ports:
        query:
          port: 15637
          protocol: UDP
    internal:
      controller: main
      type: LoadBalancer
      annotations:
        internal.ivanchenko.io/hostname: "enshrouded.ivanchenko.io"
      loadBalancerIP: 10.10.61.237
      ports:
        query:
          port: 15637
          protocol: UDP

  persistence:
    savegame:
      enabled: true
      suffix: savegame
      storageClass: longhorn-ssd
      size: 2Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        main:
          main:
            - path: /home/enshrouded/savegame
    gamefiles:
      enabled: true
      suffix: gamefiles
      storageClass: longhorn-ssd
      size: 40Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        main:
          main:
            - path: /opt/enshrouded

helpers:
  infisicalSecrets:
    - name: enshrouded-secret
      infisical:
        path: "/enshrouded"
  backups:
    - pvcName: enshrouded-savegame
      resticRepoSuffix: enshrouded
