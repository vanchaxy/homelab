pocket-id:
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/pocket-id/pocket-id
            tag: v2.19.1@sha256:f085157f0b6ea4b2e8aa5ecfd99eada0d83a4960f3a3dcfd46014097d0ef7ab5
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
          env:
            APP_URL: https://id.ivanchenko.io
            TRUST_PROXY: 10.244.0.0/16
          envFrom:
            - secretRef:
                name: pocket-id
  service:
    main:
      controller: main
      type: ClusterIP
      ports:
        http:
          port: 1411

  route:
    main:
      hostnames:
        - id.ivanchenko.io
      parentRefs:
        - name: internal-gw
          namespace: envoy-gateway
          sectionName: https
      rules:
        - matches:
            - headers:
                - name: X-API-Key
                  type: RegularExpression
                  value: ".*"
          filters:
            - type: ExtensionRef
              extensionRef:
                group: gateway.envoyproxy.io
                kind: HTTPRouteFilter
                name: deny-api-key
        - backendRefs:
            - identifier: main
              port: 1411

  persistence:
    config:
      enabled: true
      suffix: config
      storageClass: longhorn-ssd
      size: 1Gi
      accessMode: ReadWriteOnce
      advancedMounts:
        main:
          main:
            - path: /app/data

helpers:
  infisicalSecrets:
    - name: pocket-id
      infisical:
        path: "/pocket-id"
  backups:
    - enabled: true
      pvcName: pocket-id-config
      resticRepoSuffix: pocket-id
      moverSecurityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

pocket-id-operator:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  userGroups:
    - name: admins
      spec:
        friendlyName: admins
    - name: family
      spec:
        friendlyName: family
    - name: friends
      spec:
        friendlyName: friends
    - name: nobody
      spec:
        friendlyName: nobody
  instance:
    enabled: true
    name: pocket-id
    spec:
      external:
        url: http://pocket-id.pocket-id.svc:1411
        apiKeySecretRef:
          name: pocket-id
          key: STATIC_API_KEY
