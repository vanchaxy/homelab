versitygw:
  strategy:
    type: Recreate

  image:
    repository: ghcr.io/versity/versitygw
    tag: v1.11.0@sha256:8319a530d08d537426e2f855bae5280709795dc73a3f0c347973ef915d6343c5

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 64Mi

  auth:
    existingSecret: versitygw

  gateway:
    virtualDomain: s3.ivanchenko.io

  httpRoute:
    enabled: true
    parentRefs:
      - name: internal-gw
        namespace: envoy-gateway
        sectionName: https
    hostnames:
      - s3.ivanchenko.io
      - '*.s3.ivanchenko.io'

  admin:
    enabled: true
    httpRoute:
      enabled: true
      parentRefs:
        - name: internal-gw
          namespace: envoy-gateway
          sectionName: https
      hostnames:
        - s3-admin.ivanchenko.io

  webui:
    enabled: true
    apiGateways:
      - https://s3.ivanchenko.io
    adminGateways:
      - https://s3-admin.ivanchenko.io
    httpRoute:
      enabled: true
      parentRefs:
        - name: internal-gw
          namespace: envoy-gateway
          sectionName: https
      hostnames:
        - versitygw.ivanchenko.io

helpers:
  infisicalSecrets:
    - name: versitygw
      infisical:
        path: "/versitygw"
  backups:
    - enabled: true
      pvcName: versitygw-data
      resticRepoSuffix: versitygw
