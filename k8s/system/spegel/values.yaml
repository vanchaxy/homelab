      memory: 96Mi
    limits:
      memory: 96Mi
  serviceMonitor:
    enabled: true
  grafanaDashboard:
    enabled: true
    mode: GrafanaOperator
    grafanaOperator:
      matchLabels:
        dashboards: grafana
