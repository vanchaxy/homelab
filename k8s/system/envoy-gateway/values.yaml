gateway-helm:
  deployment:
    envoyGateway:
      resources:
        requests:
          cpu: 10m
          memory: 224Mi
        limits:
          memory: 224Mi
  config:
    envoyGateway:
      extensionApis:
        enableBackend: true
      provider:
        type: Kubernetes
        kubernetes:
          deploy:
            type: GatewayNamespace
