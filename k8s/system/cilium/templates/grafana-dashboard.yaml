{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cilium-{{ base $path | trimSuffix ".json" }}
spec:
  allowCrossNamespaceImport: true
  folder: Network
  resyncPeriod: 10m
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
