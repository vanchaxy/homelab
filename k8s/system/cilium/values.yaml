cilium:
  namespaceOverride: "kube-system"

  k8sServiceHost: localhost
  k8sServicePort: 7445

  kubeProxyReplacement: true

  autoDirectNodeRoutes: true
  ipv4NativeRoutingCIDR: 10.244.0.0/16
  routingMode: native

  loadBalancer:
    mode: dsr
    algorithm: maglev

  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE

  envoy:
    securityContext:
      capabilities:
        keepCapNetBindService: true
        envoy:
          - NET_ADMIN
          - PERFMON
          - BPF

  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup

  ipam:
    mode: kubernetes
    multiPoolPreAllocation: "default=8"

  rollOutCiliumPods: true
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

  # Drop CPU limit from the install-cni-binaries init container too
  cni:
    resources:
      limits:
        cpu: null

  operator:
    rollOutPods: true
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi

  k8sClientRateLimit:
    qps: 100
    burst: 500

  l2announcements:
    enabled: true

  bgpControlPlane:
    enabled: true

  dnsProxy:
    minTtl: 3600
    proxyResponseMaxDelay: 1s

  hubble:
    enabled: true
    tls:
      auto:
        method: cronJob
    metrics:
      serviceMonitor:
        enabled: true
      dynamic:
        enabled: true
        config:
          content:
            - name: dns
              contextOptions:
                - name: sourceContext
                  values: [workload-name, reserved-identity]
                - name: labelsContext
                  values: [source_namespace]
            - name: drop
              contextOptions:
                - name: sourceContext
                  values: [workload-name, reserved-identity]
                - name: destinationContext
                  values: [app, reserved-identity]
                - name: labelsContext
                  values: [source_namespace, destination_namespace]
            - name: flow
              contextOptions:
                - name: sourceContext
                  values: [namespace, reserved-identity]
                - name: destinationContext
                  values: [namespace, reserved-identity]
            - name: policy
              contextOptions:
                - name: sourceContext
                  values: [workload-name, reserved-identity]
                - name: destinationContext
                  values: [dns, app, reserved-identity]
                - name: labelsContext
                  values: [source_namespace, destination_namespace]
              includeFilters:
                - verdict: [DROPPED]
                - experimental:
                    cel_expression:
                      - size(_flow.policy_log) > 0 && _flow.policy_log.all(l, l.startsWith("audit-"))
    export:
      static:
        enabled: true
        filePath: stdout
        allowList:
          - '{"event_type":[{"type":5}]}'
          - '{"event_type":[{"type":129}],"reply":[true]}'
          - '{"event_type":[{"type":4,"sub_type":0,"match_sub_type":true}],"tcp_flags":[{"SYN":true}],"reply":[false]}'
          - '{"verdict":["DROPPED"]}'
        fieldMask:
          - time
          - node_name
          - verdict
          - drop_reason_desc
          - Type
          - event_type
          - traffic_direction
          - is_reply
          - IP
          - l4
          - l7
          - source.identity
          - source.namespace
          - source.pod_name
          - source.workloads
          - destination.identity
          - destination.namespace
          - destination.pod_name
          - destination.workloads
          - destination_names
          - policy_match_type
          - policy_log
          - egress_allowed_by
          - ingress_allowed_by
          - egress_denied_by
          - ingress_denied_by
    relay:
      enabled: true
      rollOutPods: true
    ui:
      enabled: true
      rollOutPods: true

