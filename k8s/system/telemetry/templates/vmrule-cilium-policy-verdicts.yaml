apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: cilium-policy-verdicts
  namespace: telemetry
spec:
  groups:
    - name: cilium-policy-verdicts
      rules:
        - alert: CiliumPolicyDrop
          expr: |
            sum by (direction, source_namespace, source, destination_namespace, destination) (
              increase(hubble_policy_verdicts_total{action="dropped"}[15m])
            ) > 0
          labels:
            severity: warning
          annotations:
            summary: {{ `'Cilium policy dropped {{ $labels.direction }} {{ $labels.source }} -> {{ $labels.destination }}'` }}
            description: 'An enforced network policy denied traffic in the last 15m. Either the policy is missing a legitimate flow or the workload attempted a connection it should not. Flows are in VictoriaLogs: kubernetes.container_name:cilium-agent flow.verdict:DROPPED'
        - alert: CiliumPolicyAudit
          expr: |
            sum by (direction, source_namespace, source, destination_namespace, destination) (
              increase(hubble_policy_verdicts_total{action="audit"}[1h])
            ) > 0
          labels:
            severity: warning
          annotations:
            summary: {{ `'Cilium policy would drop {{ $labels.direction }} {{ $labels.source }} -> {{ $labels.destination }}'` }}
            description: 'Traffic in the last 1h would be denied once policy audit mode is disabled. Extend the policy or confirm the flow is unwanted before enforcing. Flows are in VictoriaLogs: kubernetes.container_name:cilium-agent flow.verdict:AUDIT'
