apiVersion: v1
kind: Service
metadata:
  name: adguard
spec:
  ports:
    - name: http
      port: {{ .Values.adguard.port }}
      targetPort: {{ .Values.adguard.port }}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: adguard
  labels:
    kubernetes.io/service-name: adguard
addressType: IPv4
ports:
  - name: http
    port: {{ .Values.adguard.port }}
    protocol: TCP
endpoints:
  - addresses:
      - {{ .Values.adguard.address | quote }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguard
spec:
  hostnames:
    - {{ printf "adguard.%s" .Values.domain }}
  parentRefs:
    - name: internal-gw
      namespace: envoy-gateway
      sectionName: https
  rules:
    - backendRefs:
        - name: adguard
          port: {{ .Values.adguard.port }}
