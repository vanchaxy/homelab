longhorn:
  persistence:
    defaultClass: false
  metrics:
    serviceMonitor:
      enabled: true
  networkPolicies:
    restrictInternalTraffic: false
  preUpgradeChecker:
    upgradeVersionCheck: false
    jobEnabled: false
  defaultSettings:
    backupTarget: s3://longhorn-vanchaxy@dummyregion/
    backupTargetCredentialSecret: b2-secret
    createDefaultDiskLabeledNodes: "true"
    storageOverProvisioningPercentage: "100"
    defaultReplicaCount: "2"
    autoDeletePodWhenVolumeDetachedUnexpectedly: "true"
    nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
    nodeDrainPolicy: allow-if-replica-is-stopped
    snapshotDataIntegrity:
      v1: fast-check
      v2: fast-check
    snapshotDataIntegrityImmediateCheckAfterSnapshotCreation:
      v1: "true"
      v2: "true"
    fastReplicaRebuildEnabled:
      v1: "true"
      v2: "true"
  httproute:
    enabled: true
    hostnames:
      - longhorn.ivanchenko.io
    parentRefs:
      - name: internal-gw
        namespace: envoy-gateway
        sectionName: https

helpers:
  oidcClients:
    - name: longhorn
      spec:
        clientID: "ad53b7b9-99cd-4399-8967-cee24a505944"
        name: Longhorn
        callbackUrls:
          - "https://longhorn.ivanchenko.io/oauth2/callback"
        logoutCallbackUrls:
          - "https://longhorn.ivanchenko.io/logout"
        launchUrl: "https://longhorn.ivanchenko.io/"
        allowedUserGroups:
          - name: admins
            namespace: pocket-id
        secret:
          name: longhorn-oidc
          keys:
            clientSecret: client-secret
  infisicalSecrets:
    - name: b2-secret
      infisical:
        path: "/longhorn/b2"
  oidcPolicy:
    routes:
      - longhorn-httproute
    clientID: "ad53b7b9-99cd-4399-8967-cee24a505944"
    clientSecretName: "longhorn-oidc"
    cookieDomain: "longhorn.ivanchenko.io"
