apiVersion: v1
kind: Service
metadata:
  name: unraid
  annotations:
    lbipam.cilium.io/ips: "10.10.61.10"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: unraid
  ports:
    - name: http
      port: 80
      protocol: TCP
    - name: https
      port: 443
      protocol: TCP
    - name: smb
      port: 445
      protocol: TCP
    - name: nfs
      port: 2049
      protocol: TCP
