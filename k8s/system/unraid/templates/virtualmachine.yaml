apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: unraid
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unraid
    spec:
      nodeSelector:
        homelab/role: nas
      tolerations:
        - key: homelab/nas
          operator: Exists
          effect: NoSchedule
      evictionStrategy: None
      terminationGracePeriodSeconds: 300
      domain:
        cpu:
          cores: 2
        memory:
          guest: 6Gi
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          hostDevices:
            - name: sata
              deviceName: homelab.io/jmb585-sata
            - name: flash
              deviceName: homelab.io/unraid-flash
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
