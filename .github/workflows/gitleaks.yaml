name: gitleaks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          VERSION: 8.28.0
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            range="${BASE}..${GITHUB_SHA}"
          else
            range="${GITHUB_SHA}~1..${GITHUB_SHA}"
          fi
          gitleaks git --log-opts="$range" --redact --no-banner --exit-code 1 .
